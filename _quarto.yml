project:
  type: website
  render:
    - "index.qmd"
    - "curriculum.qmd"
    - "foundations/**/*.qmd"
    - "foundations/**/*.md"
    - "courses/**/*.qmd"
    - "courses/**/*.md"

website:
  title: "ISOE School"
  site-url: "https://wirsteve.github.io/isoe-school/"
  search: true
  reader-mode: true
  sidebar:
    style: floating
    collapse-level: 2
    contents:
      - index.qmd
      - curriculum.qmd
      - section: "Foundations"
        contents: "foundations/**"
      - section: "Courses"
        contents: "courses/**"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 2
    smooth-scroll: true
